<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
        <title th:text="'我的书签_'+${application.website.name}"></title>
        <meta name="keywords" th:content="'我的书签,个人中心,'+${application.website.name}+'小说,'+${application.website.name}"/>
        <meta name="description"
              th:content="${application.website.name}+'小说每日更新小说连载,小说排行榜,提供言情小说,都市小说,玄幻小说,穿越小说,青春小说,总裁豪门小说,网络小说,免费小说,全本小说,首发小说,最新章节免费小说阅读,精彩尽在'+${application.website.name}+'小说！'"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/user/userinfo.html">个人中心</a></li>
                <li><a class="link_4" href="/user/favorites.html">我的书架</a></li>
                <li><a class="link_9 on" href="/user/bookmark_list.html">我的书签</a></li>
                <li><a class="link_6" href="/user/comment.html">我的书评</a></li>
                <li><a class="link_7" href="/user/feedback_list.html">我的反馈</a></li>
                <li><a class="link_8" href="/user/setup.html">账号设置</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl"><a href="javascript:void(0);" class="red">我的书签</a></h2><i
                        class="fl ml20 mr20 font16">|</i>
                    <h2 class="fl"><a href="/user/favorites.html">我的书架</a></h2>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                书名
                            </th>
                            <th class="name">
                                章节
                            </th>
                            <th class="chapter">
                                书签名称
                            </th>
                            <th class="time">
                                创建时间
                            </th>
                            <th class="goread">
                                操作
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookmarkList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="bookmarkPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>


</body>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    search(1, 10);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/user/bookmark/listAllByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookmarkList = data.data.list;
                    if (bookmarkList.length > 0) {
                        var bookmarkListHtml = "";
                        for (var i = 0; i < bookmarkList.length; i++) {
                            var bookmark = bookmarkList[i];
                            bookmarkListHtml += (" <tr id='bookmark" + bookmark.id + "' class=\"book_list\" vals=\"291\">\n" +
                                "                            <td class=\"style bookclass\">\n" +
                                "                                <a href=\"/book/" + bookmark.bookId + ".html\" >" + bookmark.bookName + "</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"name\">\n" +
                                "<a href='/book/" + bookmark.bookId + "/" + bookmark.indexId + ".html'>" + bookmark.indexName + "</a>" +
                                "                            </td>\n" +
                                "                            <td class=\"chapter\">\n" +
                                "                                " + (bookmark.bookmarkName || '-') + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"time\">\n" +
                                "                                " + bookmark.createTime + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "<div><a href='/book/" + bookmark.bookId + "/" + bookmark.indexId + ".html'>跳转阅读</a></div>" +
                                "<div style='line-height:8px;padding-bottom:13px'><a href='javascript:deleteBookmark(\"" + bookmark.id + "\")'>删除书签</a></div>" +
                                "                            </td>\n" +
                                "                        </tr>");
                        }
                        $("#bookmarkList").html(bookmarkListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            laypage.render({
                                elem: 'bookmarkPage'
                                , count: data.data.total
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {

                                    console.log(obj.curr);
                                    console.log(obj.limit);

                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

    function deleteBookmark(bookmarkId) {

        $.ajax({
            type: "delete",
            url: "/user/bookmark/" + bookmarkId,
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#bookmark" + bookmarkId).remove();
                }
            }
        });

    }
</script>
</html>
