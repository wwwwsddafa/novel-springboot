<script language="javascript" type="text/javascript">
    var logo = $("#logo").val();
    var logoDark = $("#logoDark").val();
    if (font) {
        $(".readBox").css("font-size", font + "px");
        $("#cFonts").html(font);
        $("#ChapterBody").attr("class", "article-content font" + font);
        BookDetail.reShowCover();
    }
    if (fontNum) {
        BookDetail.SetReadFontFamily(fontNum);
    }
    if (colorNum) {
        BookDetail.SetBackUpColor(colorNum);
        if (colorNum == 6) {
            $(".logo img").attr("src", logoDark);
        }
    }
    //查询是否在书架
    $.ajax({
        type: "get",
        url: "/user/queryIsInShelf",
        data: {'bookId': $("#bookId").val()},
        dataType: "json",
        success: function (data) {
            if (data.code == 200) {
                if (data.data) {
                    $("#cFavs").html("<a class=\"ico_shelf\" href=\"javascript:void(0);\"><b>已收藏</b></a>");
                }
                //添加阅读记录
                $.ajax({
                    type: "POST",
                    url: "/user/addReadHistory",
                    data: {'bookId': $("#bookId").val(), 'preContentId': $("#preContentId").val()},
                    dataType: "json",
                    success: function (data) {

                    },
                    error: function () {
                    }
                })


            } else if (data.code == 1001) {
                //未登录

            } else {
                layer.alert(data.msg);
            }

        },
        error: function () {
            layer.alert('网络异常');
        }
    })


    var bookId = $("#bookId").val();
    var indexId = $("#preContentId").val();
    var preIndexId = $("#preIndexId").val();
    var nextIndexId = $("#nextIndexId").val();
    $(function () {
        // 显示右侧菜单（prev/next/自动滚屏）
        $(".menu_right").show();
        BookDetail.GetReadSet(bookId, indexId, preIndexId, nextIndexId, 1);
        $(".ico_setup").click(function () {

            $(".maskBox,.setupBox").show();
        });
        $(".ico_phone").click(function () {
            $(".maskBox,.qrBox").show();
        });

        $(window).scroll(function () {
            var vtop = $(document).scrollTop();
            var vbottom = $(document).height() - vtop - $(window).height();
            if (vtop > 50) {
                $(".menu_left").css("position", "fixed");
                $(".menu_left").css("top", "2px");
            } else {
                $(".menu_left").css("position", "absolute");
                $(".menu_left").css("top", "60px")
            }

            if (vbottom < 150) {
                $(".menu_right").css("position", "absolute");
                $(".menu_right").css("bottom", "150px");
            } else {
                $(".menu_right").css("position", "fixed");
                $(".menu_right").css("bottom", "2px");
            }
        });

        var bgClass = '1';
        if (bgClass == 6) {
            $(".logo img").attr("src", logoDark);
        }
        $(".readTheme a").click(function () {
            $(".logo img").attr("src", logo);
        })
        $("#setup_color_night").click(function () {
            $(".logo img").attr("src", logoDark);
        });


    });

    function enterPreIndexPage(bookId, bookIndexId) {
        if (bookIndexId != 0) {
            window.location.href = '/book/' + bookId + '/' + bookIndexId + ".html";
        } else {
            window.location.href = '/book/indexList-' + bookId + '.html';
        }

    }

    function enterNextIndexPage(bookId, bookIndexId) {
        if (bookIndexId != 0) {
            window.location.href = '/book/' + bookId + '/' + bookIndexId + ".html";
        } else {
            window.location.href = '/book/indexList-' + bookId + '.html';
        }

    }

    function buyBookIndex() {
        $.ajax({
            type: "POST",
            url: "/user/buyBookIndex",
            data: {
                'bookId': $("#bookId").val(), "bookName": $("#bookName").val(),
                "bookIndexId": $("#preContentId").val(), "bookIndexName": $("#preIndexName").val()
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    location.reload();


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

    function addBookmark() {
        var bookId = $('#bookId').val();
        var indexId = $('#preContentId').val();
        var indexName = $('#preIndexName').val();
        var bookmarkName = prompt('请输入书签名称（可选，默认使用当前章节名）：', indexName);

        $.ajax({
            type: "POST",
            url: "/user/bookmark",
            data: {
                bookId: bookId,
                indexId: indexId,
                bookmarkName: bookmarkName || ''
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    layer.alert('书签添加成功！');
                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('网络异常');
            }
        });
    }

    // ============ 自动滚屏 ============
    var autoScrollId = null;
    var scrollSpeed = 1; // 每帧滚动的像素基数
    var scrollSpeedMultiplier = parseFloat(localStorage.getItem('autoScrollSpeed')) || 1;

    function refreshSpeedUI() {
        var label = scrollSpeedMultiplier + 'x';
        $('#autoScrollSpeedLabel').text(label);
        // 高亮底部速度栏匹配的按钮（精确匹配）
        $('#autoScrollBar .speed-btn').removeClass('active');
        $('#autoScrollBar .speed-btn').each(function () {
            if (parseFloat($(this).data('speed')) === scrollSpeedMultiplier) {
                $(this).addClass('active');
            }
        });
        localStorage.setItem('autoScrollSpeed', scrollSpeedMultiplier);
    }

    function adjustSpeed(delta) {
        var next = Math.round((scrollSpeedMultiplier + delta) * 100) / 100;
        if (next < 0.25) next = 0.25;
        if (next > 3) next = 3;
        scrollSpeedMultiplier = next;
        refreshSpeedUI();
    }

    function toggleAutoScroll() {
        if (autoScrollId) {
            stopAutoScroll();
        } else {
            startAutoScroll();
        }
    }

    function startAutoScroll() {
        function step() {
            window.scrollBy(0, scrollSpeed * scrollSpeedMultiplier);
            autoScrollId = requestAnimationFrame(step);
        }
        autoScrollId = requestAnimationFrame(step);
        // 侧栏按钮
        $('#autoScrollBtn b').text('停止滚屏');
        $('#autoScrollBtn').addClass('on');
        // 浮动按钮 — 变为暂停图标并变绿
        $('#autoScrollFloat a[onclick*="toggleAutoScroll"]')
            .css({color: '#e74c3c', background: 'rgba(255,255,255,.95)'})
            .html('&#x23F8;');
        // 速度栏
        $('#autoScrollBar').show();
    }

    function stopAutoScroll() {
        if (autoScrollId) {
            cancelAnimationFrame(autoScrollId);
            autoScrollId = null;
        }
        $('#autoScrollBtn b').text('自动滚屏');
        $('#autoScrollBtn').removeClass('on');
        // 浮动按钮 — 恢复播放图标
        $('#autoScrollFloat a[onclick*="toggleAutoScroll"]')
            .css({color: '#666', background: 'rgba(255,255,255,.9)'})
            .html('▶');
        $('#autoScrollBar').hide();
    }

    function setScrollSpeed(multiplier) {
        scrollSpeedMultiplier = multiplier;
        refreshSpeedUI();
    }

    // 页面加载时恢复速度偏好 UI
    refreshSpeedUI();

    // 点击/触摸页面其他区域自动暂停滚屏
    $(document).on('click touchstart', function (e) {
        if (autoScrollId && !$(e.target).closest('#autoScrollBtn, #autoScrollBar, #autoScrollFloat').length) {
            stopAutoScroll();
        }
    });

    // 键盘空格键切换滚屏
    $(document).on('keydown', function (e) {
        // 排除在 input/textarea 中输入时空格
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
        }
        if (e.key === ' ' || e.keyCode === 32) {
            e.preventDefault();
            toggleAutoScroll();
        }
    });

    $.post("/book/addVisitCount", {"bookId": $("#bookId").val()}, function () {
    });

    // ============ 划线评论 ============
    var _inlineEmojiList = ['👍','👎','😂','❤️','😮','😢','👏','🔥','💡','📖','✨','🤔'];

    function initParagraphIds() {
        var counter = 0;
        $('#showReading').find('p').each(function() {
            var text = $(this).text().trim();
            if (text.length > 0 && !$(this).attr('data-pid')) {
                $(this).attr('data-pid', 'P' + String(++counter).padStart(3, '0'));
            }
        });
    }

    function loadInlineCommentMarks() {
        var indexId = $('#preContentId').val();
        if (!indexId) return;
        $('.inline-comment-mark').remove();
        $.get('/book/listParagraphCommentCounts', {indexId: indexId}, function(res) {
            if (res.code === 200) {
                var counts = res.data;
                for (var pid in counts) {
                    var p = $('p[data-pid="' + pid + '"]');
                    if (p.length) {
                        p.append('<span class="inline-comment-mark" data-pid="' + pid + '"><sup>' + counts[pid] + '</sup></span>');
                    }
                }
            }
        });
    }

    $(document).on('click', '.inline-comment-mark', function(e) {
        e.stopPropagation();
        var pid = $(this).data('pid');
        var indexId = $('#preContentId').val();
        showInlineCommentPanel(pid, indexId, this);
    });

    function showInlineCommentPanel(pid, indexId, anchor) {
        var rect = anchor.getBoundingClientRect();
        var $panel = $('#inlineCommentPanel');
        var top = rect.bottom + window.scrollY + 5;
        var left = Math.min(rect.left + window.scrollX, $(window).width() - 340);
        $panel.css({top: top, left: left}).data('pid', pid).data('indexId', indexId).show();
        var quoteText = $('p[data-pid="' + pid + '"]').text().trim();
        var shortQuote = quoteText.length > 30 ? quoteText.substring(0, 30) + '…' : quoteText;
        $('#inlineCommentPanelTitle').html('划线评论 <span style="font-weight:normal;color:#999;font-size:12px;">' + shortQuote + '</span>');
        $.get('/book/listInlineComments', {indexId: indexId, paragraphId: pid}, function(res) {
            if (res.code === 200) {
                var html = '';
                for (var i = 0; i < res.data.length; i++) {
                    var c = res.data[i];
                    html += '<div class="inline-comment-item">'
                        + '<img src="' + (c.createUserPhoto || '/images/man.png') + '" class="inline-comment-avatar"/>'
                        + '<div class="inline-comment-body">'
                        + '<span class="inline-comment-name">' + c.createUserName + '</span>'
                        + '<span class="inline-comment-text">' + c.commentContent + '</span>'
                        + '<div class="inline-comment-actions">'
                        + '<a href="javascript:void(0)" onclick="toggleInlineCommentLike(' + c.id + ')" class="ic-act">👍 <span id="icLike' + c.id + '">' + (c.likesCount || 0) + '</span></a>'
                        + '<a href="javascript:void(0)" onclick="toggleInlineCommentUnLike(' + c.id + ')" class="ic-act">👎 <span id="icUnLike' + c.id + '">' + (c.unLikesCount || 0) + '</span></a>'
                        + '<a href="/book/reply-' + c.id + '.html" class="ic-act">回复(' + (c.replyCount || 0) + ')</a>'
                        + '</div>'
                        + '<span class="inline-comment-time">' + c.createTime + '</span>'
                        + '</div></div>';
                }
                $('#inlineCommentList').html(html || '<div style="padding:10px;color:#999;">暂无评论</div>');
            }
        });
    }

    function toggleInlineCommentLike(commentId) {
        $.post('/book/toggleCommentLike', {commentId: commentId}, function(res) {
            if (res.code === 200) {
                $('#icLike' + commentId).text(res.data);
            } else if (res.code === 1001) {
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            }
        });
    }

    function toggleInlineCommentUnLike(commentId) {
        $.post('/book/toggleCommentUnLike', {commentId: commentId}, function(res) {
            if (res.code === 200) {
                $('#icUnLike' + commentId).text(res.data);
            } else if (res.code === 1001) {
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            }
        });
    }

    $('#showReading').on('mouseup', function(e) {
        var sel = window.getSelection();
        var text = sel.toString().trim();
        if (!text || text.length < 5) return;
        var range = sel.getRangeAt(0);
        var startP = $(range.startContainer).closest('p[data-pid]');
        if (!startP.length) return;
        var pid = startP.attr('data-pid');
        var $bubble = $('#writeBubble');
        $bubble.data('pid', pid).data('quote', text);
        var top = e.clientY + window.scrollY - 45;
        var left = e.clientX + window.scrollX - 30;
        $bubble.css({top: top, left: left}).show();
        $('#inlineCommentForm').hide();
    });

    $(document).on('mousedown', function(e) {
        if (!$(e.target).closest('#writeBubble, #inlineCommentPanel').length) {
            $('#writeBubble').hide();
        }
    });

    function insertInlineEmoji(emoji) {
        var $input = $('#inlineCommentInput');
        $input.val($input.val() + emoji).focus();
    }

    function submitInlineComment() {
        var pid = $('#writeBubble').data('pid');
        var content = $('#inlineCommentInput').val().trim();
        if (!content || content.length < 2) {
            layer.alert('评论内容至少2个字');
            return;
        }
        $.post('/book/addBookComment', {
            bookId: $('#bookId').val(),
            indexId: $('#preContentId').val(),
            paragraphId: pid,
            commentType: 2,
            commentContent: content
        }, function(res) {
            if (res.code === 200) {
                layer.msg('发表成功');
                $('#writeBubble').hide();
                $('#inlineCommentInput').val('');
                window.getSelection().removeAllRanges();
                loadInlineCommentMarks();
                var $panel = $('#inlineCommentPanel');
                if ($panel.is(':visible') && $panel.data('pid') === pid) {
                    showInlineCommentPanel(pid, $panel.data('indexId'), $('.inline-comment-mark[data-pid="' + pid + '"]')[0]);
                }
            } else if (res.code === 1001) {
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            } else {
                layer.alert(res.msg);
            }
        });
    }

    initParagraphIds();
    loadInlineCommentMarks();
</script>

<!-- 划线评论 UI -->
<div id="writeBubble" style="display:none; position:absolute; z-index:1000;">
    <div class="write-bubble-btn" onclick="$('#inlineCommentForm').toggle()">写想法</div>
    <div id="inlineCommentForm" style="display:none; margin-top:6px; background:#fff; border:1px solid #e0e0e0; border-radius:6px; padding:8px; box-shadow:0 2px 12px rgba(0,0,0,.1);">
        <div id="inlineEmojiBar" style="margin-bottom:4px;"></div>
        <textarea id="inlineCommentInput" placeholder="写下你的想法..." style="width:220px;height:50px;border:1px solid #ddd;border-radius:4px;padding:4px;font-size:13px;resize:none;"></textarea>
        <div style="text-align:right; margin-top:4px;">
            <button onclick="submitInlineComment()" style="padding:4px 14px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">发表</button>
        </div>
    </div>
</div>

<div id="inlineCommentPanel" style="display:none; position:absolute; z-index:999; background:#fff; border:1px solid #e0e0e0; border-radius:8px; width:320px; max-height:420px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,.12);">
    <div style="padding:8px 12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <span id="inlineCommentPanelTitle" style="font-weight:bold; font-size:14px;">划线评论</span>
        <span onclick="$('#inlineCommentPanel').hide()" style="cursor:pointer; font-size:18px; color:#999;">×</span>
    </div>
    <div id="inlineCommentList" style="padding:8px 12px;"></div>
</div>

<script>
    (function() {
        var bar = document.getElementById('inlineEmojiBar');
        if (!bar) return;
        var html = '';
        for (var i = 0; i < _inlineEmojiList.length; i++) {
            html += '<span onclick="insertInlineEmoji(\'' + _inlineEmojiList[i] + '\')" style="cursor:pointer;font-size:18px;margin-right:4px;display:inline-block;padding:2px;">' + _inlineEmojiList[i] + '</span>';
        }
        bar.innerHTML = html;
    })();
</script>

<style>
    .inline-comment-mark {
        display: inline-block;
        margin-left: 4px;
        cursor: pointer;
        vertical-align: super;
    }
    .inline-comment-mark sup {
        background: #4a90d9;
        color: #fff;
        border-radius: 8px;
        padding: 1px 5px;
        font-size: 10px;
        font-weight: bold;
    }
    .write-bubble-btn {
        background: #4a90d9;
        color: #fff;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
        display: inline-block;
    }
    .inline-comment-item {
        display: flex;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
    }
    .inline-comment-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        margin-right: 8px;
        flex-shrink: 0;
    }
    .inline-comment-body {
        flex: 1;
        min-width: 0;
    }
    .inline-comment-name {
        display: block;
        font-size: 12px;
        color: #999;
    }
    .inline-comment-text {
        display: block;
        font-size: 13px;
        color: #333;
        margin: 2px 0;
        word-break: break-all;
    }
    .inline-comment-actions {
        margin: 4px 0 2px;
    }
    .ic-act {
        display: inline-block;
        font-size: 12px;
        color: #888;
        margin-right: 10px;
        text-decoration: none;
        cursor: pointer;
    }
    .ic-act:hover {
        color: #4a90d9;
    }
    .inline-comment-time {
        display: block;
        font-size: 11px;
        color: #bbb;
    }
</style>
</body>
</html>
