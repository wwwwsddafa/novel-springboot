<script>
    var autoScrollId = null;
    var scrollSpeed = 1;
    var scrollSpeedMultiplier = parseFloat(localStorage.getItem('autoScrollSpeed')) || 1;

    function refreshSpeedUI() {
        var label = scrollSpeedMultiplier + 'x';
        $('#mobileAutoScrollSpeedLabel').text(label);
        localStorage.setItem('autoScrollSpeed', scrollSpeedMultiplier);
    }
    refreshSpeedUI();

    function adjustSpeed(delta) {
        var next = Math.round((scrollSpeedMultiplier + delta) * 100) / 100;
        if (next < 0.25) next = 0.25;
        if (next > 3) next = 3;
        scrollSpeedMultiplier = next;
        refreshSpeedUI();
    }

    function toggleAutoScroll() {
        if (autoScrollId) {
            stopAutoScroll();
        } else {
            startAutoScroll();
        }
    }

    function startAutoScroll() {
        function step() {
            window.scrollBy(0, scrollSpeed * scrollSpeedMultiplier);
            autoScrollId = requestAnimationFrame(step);
        }
        autoScrollId = requestAnimationFrame(step);
        $('#mobileAutoScrollBtn').text('暂停').addClass('on');
        $('#mobileAutoScrollSpeedWrap').show();
    }

    function stopAutoScroll() {
        if (autoScrollId) {
            cancelAnimationFrame(autoScrollId);
            autoScrollId = null;
        }
        $('#mobileAutoScrollBtn').text('滚屏').removeClass('on');
        $('#mobileAutoScrollSpeedWrap').hide();
    }

    $(document).on('click touchstart', function (e) {
        if (autoScrollId && !$(e.target).closest('#mobileAutoScrollBtn, #mobileAutoScrollSpeedWrap').length) {
            stopAutoScroll();
        }
    });
</script>

<script language="javascript">
    var books = localStorage.getItem("historyBooks");

    if (books) {

        if (booksArr.length >= 50) {
            booksArr.splice(0, 1);
        }
        booksArr.remove(item);
        booksArr[booksArr.length] = item;
    } else {
        var booksArr = [item];
    }

    localStorage.setItem("historyBooks", JSON.stringify(booksArr));//

    function toMyCollect() {
        var token = localStorage.getItem("token");
        if (token) {
            window.location.href = "/book/search?token=" + token;
        } else {
            window.location.href = "/user/login.html";
        }
    }

    function buyBookIndex() {
        $.ajax({
            type: "POST",
            url: "/user/buyBookIndex",
            data: {
                'bookId': $("#bookIdHidden").val(), "bookName": $("#bookNameHidden").val(),
                "bookIndexId": $("#contentIdHidden").val(), "bookIndexName": $("#indexNameHidden").val()
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    location.reload();


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);


                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

        }

    function speakChapter() {
        console.log('speechSynthesis.paused', speechSynthesis.paused)
        console.log('speechSynthesis.pending', speechSynthesis.pending)
        console.log('speechSynthesis.speaking', speechSynthesis.speaking)
        if (speechSynthesis.speaking && !speechSynthesis.paused) {
            speechSynthesis.pause();
            return;
        }
        if (speechSynthesis.speaking && speechSynthesis.paused) {
            speechSynthesis.resume();
        }
        speak({
            'text': $('#chaptercontent').text(),

            'pitch': 1,

        }, function () {
            console.log('语音开始播放');
        });


    }

    /**
     * @description 文字转语音方法
     * @public
     * @param { text, rate, lang, volume, pitch } object
     * @param  text 要合成的文字内容，字符串
     * @param  speechRate 读取文字的语速 0.1~10  正常1
     * @param  lang 读取文字时的语言
     * @param  volume  读取时声音的音量 0~1  正常1
     * @param  voice  读取文字的语音服务
     * @param  pitch  读取时声音的音高 0~2  正常1
     * @returns SpeechSynthesisUtterance
     */
    function speak({text, speechRate, lang, volume, pitch, voice}, endEvent, startEvent) {
        if (!window.SpeechSynthesisUtterance) {
            console.warn('当前浏览器不支持文字转语音服务')
            return;
        }

        if (!text) {
            return;
        }

        const speechUtterance = new SpeechSynthesisUtterance();
        speechUtterance.text = text;
        speechUtterance.rate = speechRate || 1;
        speechUtterance.lang = lang || 'zh-CN';
        speechUtterance.volume = volume || 1;
        speechUtterance.pitch = pitch || 1;
        speechUtterance.voice = voice || null;
        speechUtterance.onend = function () {
            endEvent && endEvent();
        };
        speechUtterance.onstart = function () {
            startEvent && startEvent();
        };
        speechSynthesis.speak(speechUtterance);

        return speechUtterance;
    }

    // ============ 划线评论（移动端） ============
    var _inlineEmojiList = ['👍','👎','😂','❤️','😮','😢','👏','🔥','💡','📖','✨','🤔'];

    function initParagraphIdsMobile() {
        var container = $('#chaptercontent');
        var counter = 0;
        container.find('p').each(function() {
            var text = $(this).text().trim();
            if (text.length > 0 && !$(this).attr('data-pid')) {
                $(this).attr('data-pid', 'P' + String(++counter).padStart(3, '0'));
            }
        });
        if (counter === 0) {
            var span = container.find('span').first();
            var html = span.html();
            if (html) {
                var blocks = html.split(/<br\s*\/?>/i);
                var newHtml = '';
                for (var i = 0; i < blocks.length; i++) {
                    if (blocks[i].trim()) {
                        newHtml += '<p data-pid="P' + String(i + 1).padStart(3, '0') + '">' + blocks[i] + '</p>';
                    }
                }
                span.html(newHtml);
            }
        }
    }

    function loadInlineCommentMarksMobile() {
        var indexId = $('#contentIdHidden').val();
        if (!indexId) return;
        $('.inline-comment-mark').remove();
        $.get('/book/listParagraphCommentCounts', {indexId: indexId}, function(res) {
            if (res.code === 200) {
                var counts = res.data;
                for (var pid in counts) {
                    var p = $('p[data-pid="' + pid + '"]');
                    if (p.length) {
                        p.append('<span class="inline-comment-mark" data-pid="' + pid + '"><sup>' + counts[pid] + '</sup></span>');
                    }
                }
            }
        });
    }

    $(document).on('click touchend', '.inline-comment-mark', function(e) {
        e.stopPropagation();
        var pid = $(this).data('pid');
        var indexId = $('#contentIdHidden').val();
        showInlineCommentPanelMobile(pid, indexId, this);
    });

    function showInlineCommentPanelMobile(pid, indexId, anchor) {
        var rect = anchor.getBoundingClientRect();
        var $panel = $('#inlineCommentPanel');
        var top = rect.bottom + window.scrollY + 5;
        var left = Math.max(10, Math.min(rect.left + window.scrollX, $(window).width() - 310));
        $panel.css({top: top, left: left}).data('pid', pid).data('indexId', indexId).show();
        var quoteText = $('p[data-pid="' + pid + '"]').text().trim();
        var shortQuote = quoteText.length > 20 ? quoteText.substring(0, 20) + '…' : quoteText;
        $('#inlineCommentPanelTitle').html('划线评论 <span style="font-weight:normal;color:#999;font-size:12px;">' + shortQuote + '</span>');
        $.get('/book/listInlineComments', {indexId: indexId, paragraphId: pid}, function(res) {
            if (res.code === 200) {
                var html = '';
                for (var i = 0; i < res.data.length; i++) {
                    var c = res.data[i];
                    html += '<div class="inline-comment-item">'
                        + '<img src="' + (c.createUserPhoto || '/images/man.png') + '" class="inline-comment-avatar"/>'
                        + '<div class="inline-comment-body">'
                        + '<span class="inline-comment-name">' + c.createUserName + '</span>'
                        + '<span class="inline-comment-text">' + c.commentContent + '</span>'
                        + '<div class="inline-comment-actions">'
                        + '<a href="javascript:void(0)" onclick="toggleInlineCommentLikeM(' + c.id + ')" class="ic-act">👍 <span id="icLike' + c.id + '">' + (c.likesCount || 0) + '</span></a>'
                        + '<a href="javascript:void(0)" onclick="toggleInlineCommentUnLikeM(' + c.id + ')" class="ic-act">👎 <span id="icUnLike' + c.id + '">' + (c.unLikesCount || 0) + '</span></a>'
                        + '<a href="/book/reply-' + c.id + '.html" class="ic-act">回复(' + (c.replyCount || 0) + ')</a>'
                        + '</div>'
                        + '<span class="inline-comment-time">' + c.createTime + '</span>'
                        + '</div></div>';
                }
                $('#inlineCommentList').html(html || '<div style="padding:10px;color:#999;">暂无评论</div>');
            }
        });
    }

    function toggleInlineCommentLikeM(commentId) {
        $.post('/book/toggleCommentLike', {commentId: commentId}, function(res) {
            if (res.code === 200) { $('#icLike' + commentId).text(res.data); }
            else if (res.code === 1001) { location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href); }
        });
    }

    function toggleInlineCommentUnLikeM(commentId) {
        $.post('/book/toggleCommentUnLike', {commentId: commentId}, function(res) {
            if (res.code === 200) { $('#icUnLike' + commentId).text(res.data); }
            else if (res.code === 1001) { location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href); }
        });
    }

    $('#chaptercontent').on('touchend mouseup', function(e) {
        setTimeout(function() {
            var sel = window.getSelection();
            var text = sel.toString().trim();
            if (!text || text.length < 5) return;
            var range = sel.getRangeAt(0);
            var startP = $(range.startContainer).closest('p[data-pid]');
            if (!startP.length) return;
            var pid = startP.attr('data-pid');
            var $bubble = $('#writeBubble');
            $bubble.data('pid', pid).data('quote', text);
            var clientX = e.originalEvent && e.originalEvent.changedTouches ? e.originalEvent.changedTouches[0].clientX : e.clientX;
            var clientY = e.originalEvent && e.originalEvent.changedTouches ? e.originalEvent.changedTouches[0].clientY : e.clientY;
            var top = clientY + window.scrollY - 45;
            var left = clientX + window.scrollX - 30;
            $bubble.css({top: top, left: left}).show();
            $('#inlineCommentForm').hide();
        }, 300);
    });

    $(document).on('mousedown touchstart', function(e) {
        if (!$(e.target).closest('#writeBubble, #inlineCommentPanel').length) {
            $('#writeBubble').hide();
        }
    });

    function insertInlineEmojiM(emoji) {
        var $input = $('#inlineCommentInput');
        $input.val($input.val() + emoji).focus();
    }

    function submitInlineCommentMobile() {
        var pid = $('#writeBubble').data('pid');
        var content = $('#inlineCommentInput').val().trim();
        if (!content || content.length < 2) {
            layer.alert('评论内容至少2个字');
            return;
        }
        $.post('/book/addBookComment', {
            bookId: $('#bookIdHidden').val(),
            indexId: $('#contentIdHidden').val(),
            paragraphId: pid,
            commentType: 2,
            commentContent: content
        }, function(res) {
            if (res.code === 200) {
                layer.msg('发表成功');
                $('#writeBubble').hide();
                $('#inlineCommentInput').val('');
                window.getSelection().removeAllRanges();
                loadInlineCommentMarksMobile();
                var $panel = $('#inlineCommentPanel');
                if ($panel.is(':visible') && $panel.data('pid') === pid) {
                    showInlineCommentPanelMobile(pid, $panel.data('indexId'), $('.inline-comment-mark[data-pid="' + pid + '"]')[0]);
                }
            } else if (res.code === 1001) {
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            } else {
                layer.alert(res.msg);
            }
        });
    }

    initParagraphIdsMobile();
    loadInlineCommentMarksMobile();
</script>

<!-- 划线评论 UI（移动端） -->
<div id="writeBubble" style="display:none; position:absolute; z-index:1000;">
    <div class="write-bubble-btn" onclick="$('#inlineCommentForm').toggle()">写想法</div>
    <div id="inlineCommentForm" style="display:none; margin-top:6px; background:#fff; border:1px solid #e0e0e0; border-radius:6px; padding:8px; box-shadow:0 2px 12px rgba(0,0,0,.1);">
        <div id="inlineEmojiBar" style="margin-bottom:4px;"></div>
        <textarea id="inlineCommentInput" placeholder="写下你的想法..." style="width:200px;height:50px;border:1px solid #ddd;border-radius:4px;padding:4px;font-size:13px;resize:none;"></textarea>
        <div style="text-align:right; margin-top:4px;">
            <button onclick="submitInlineCommentMobile()" style="padding:4px 14px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">发表</button>
        </div>
    </div>
</div>

<div id="inlineCommentPanel" style="display:none; position:absolute; z-index:999; background:#fff; border:1px solid #e0e0e0; border-radius:8px; width:300px; max-height:400px; overflow-y:auto; box-shadow:0 4px 16px rgba(0,0,0,.12);">
    <div style="padding:8px 12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <span id="inlineCommentPanelTitle" style="font-weight:bold; font-size:14px;">划线评论</span>
        <span onclick="$('#inlineCommentPanel').hide()" style="cursor:pointer; font-size:18px; color:#999;">×</span>
    </div>
    <div id="inlineCommentList" style="padding:8px 12px;"></div>
</div>

<script>
    (function() {
        var bar = document.getElementById('inlineEmojiBar');
        if (!bar) return;
        var html = '';
        for (var i = 0; i < _inlineEmojiList.length; i++) {
            html += '<span onclick="insertInlineEmojiM(\'' + _inlineEmojiList[i] + '\')" style="cursor:pointer;font-size:18px;margin-right:4px;display:inline-block;padding:2px;">' + _inlineEmojiList[i] + '</span>';
        }
        bar.innerHTML = html;
    })();
</script>

<style>
    .inline-comment-mark {
        display: inline-block;
        margin-left: 4px;
        cursor: pointer;
        vertical-align: super;
    }
    .inline-comment-mark sup {
        background: #4a90d9;
        color: #fff;
        border-radius: 8px;
        padding: 1px 5px;
        font-size: 10px;
        font-weight: bold;
    }
    .write-bubble-btn {
        background: #4a90d9;
        color: #fff;
        border-radius: 4px;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 13px;
        box-shadow: 0 2px 8px rgba(0,0,0,.15);
        display: inline-block;
    }
    .inline-comment-item {
        display: flex;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
    }
    .inline-comment-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        margin-right: 8px;
        flex-shrink: 0;
    }
    .inline-comment-body {
        flex: 1;
        min-width: 0;
    }
    .inline-comment-name {
        display: block;
        font-size: 12px;
        color: #999;
    }
    .inline-comment-text {
        display: block;
        font-size: 13px;
        color: #333;
        margin: 2px 0;
        word-break: break-all;
    }
    .inline-comment-actions {
        margin: 4px 0 2px;
    }
    .ic-act {
        display: inline-block;
        font-size: 12px;
        color: #888;
        margin-right: 10px;
        text-decoration: none;
        cursor: pointer;
    }
    .ic-act:hover {
        color: #4a90d9;
    }
    .inline-comment-time {
        display: block;
        font-size: 11px;
        color: #bbb;
    }
</style>

</html>
