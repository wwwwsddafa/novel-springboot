<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar" style="margin-bottom:10px;">
                    <form id="searchForm" class="form-inline">
                        <div class="form-group" style="margin-right:15px;">
                            <label style="margin-right:5px;">仅显示被举报评论</label>
                            <input id="reportedOnly" name="reportedOnly" type="checkbox" value="1" checked
                                   onchange="reLoad()">
                        </div>
                        <div class="form-group" style="margin-right:15px;">
                            <label style="margin-right:5px;">审核状态</label>
                            <select id="auditStatus" name="auditStatus" class="form-control input-sm"
                                    onchange="reLoad()">
                                <option value="">全部</option>
                                <option value="0">待审核</option>
                                <option value="1">审核通过</option>
                                <option value="2">审核不通过</option>
                            </select>
                        </div>
                    </form>
                </div>
                <table id="exampleTable" data-mobile-responsive="true">
                </table>
            </div>
        </div>
    </div>
</div>
<!--shiro控制bootstraptable行内按钮看见性 -->
<div>
    <script type="text/javascript">
        var s_detail_h = 'hidden';
        var s_edit_h = 'hidden';
        var s_remove_h = 'hidden';
    </script>
</div>
<div shiro:hasPermission="test:order:detail">
    <script type="text/javascript">
        s_detail_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookComment:edit">
    <script type="text/javascript">
        s_edit_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookComment:remove">
    <script type="text/javascript">
        var s_remove_h = '';
    </script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/bookComment/bookComment.js"></script>
</body>
</html>
